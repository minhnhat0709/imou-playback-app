<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Imou Headless Recorder</title>
  <link href="./imou-player.css" rel="stylesheet" />
  <script src="./imou-player.js"></script>
  <script src="./ezuikit.js"></script>
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #player-container {
      width: 100%;
      height: 100%;
    }

    /* Hide EZUIKit control elements in browser playback to keep recording clean */
    .ezui-toolbar,
    .ezui-header,
    .ezui-footer,
    [class*="ezui-"] {
      display: none !important;
    }
  </style>
</head>

<body>
  <div id="player-container"></div>

  <script>
    // Global status for Puppeteer to read
    window.recorderStatus = {
      initialized: false,
      playing: false,
      recording: false,
      error: null,
      downloadStarted: false,
      brand: 'imou'
    };

    let playerInstance = null;

    // Initialize player via query parameters
    function initPlayer() {
      const urlParams = new URLSearchParams(window.location.search);
      const brand = urlParams.get('brand') || 'imou';
      window.recorderStatus.brand = brand;

      const deviceId = urlParams.get('deviceId');
      const channelId = urlParams.get('channelId') || (brand === 'ezviz' ? '1' : '0');
      const token = urlParams.get('kitToken');
      const beginTime = urlParams.get('beginTime');
      const endTime = urlParams.get('endTime');
      const code = urlParams.get('code') || '';
      const dataCenter = urlParams.get('dataCenter') || 'sg';
      const recordType = urlParams.get('recordType') || 'localRecord';
      const domain = `https://openapi-${dataCenter.toLowerCase()}.easy4ip.com`;

      if (!deviceId || !token || !beginTime || !endTime) {
        window.recorderStatus.error = "Missing query parameters: deviceId, kitToken, beginTime, endTime";
        console.error(window.recorderStatus.error);
        return;
      }

      if (brand === 'ezviz') {
        const playUrl = urlParams.get('playUrl');
        const areaDomain = urlParams.get('areaDomain') || 'https://open.ezvizlife.com';
        if (!playUrl) {
          window.recorderStatus.error = "Missing query parameter: playUrl";
          console.error(window.recorderStatus.error);
          return;
        }

        console.log("[EZVIZ Player] Initializing with Play URL:", playUrl, "and Domain:", areaDomain);

        try {
          playerInstance = new EZUIKit.EZUIKitPlayer({
            id: "player-container",
            url: playUrl,
            accessToken: token,
            width: 800,
            height: 400,
            autoplay: true,
            downloadRecord: true,
            decoderPath: "/ezuikit_static",
            staticPath: "/ezuikit_static",
            env: {
              domain: areaDomain
            },
            handleError: function (err) {
              // Code 6701 is normal end of playback stream ("回放结束")
              if (err && (err.code === 6701 || (typeof err.msg === 'string' && err.msg.includes('回放结束')))) {
                console.log("[EZVIZ Player] Playback reached end stream normally (code 6701).");
                return;
              }
              console.error("EZUIKitPlayer Error:", err);
              window.recorderStatus.error = err;
            },
            handleSuccess: function () {
              console.log("EZUIKitPlayer Play Success!");
              window.recorderStatus.playing = true;
            },
            stopSaveCallBack: function (res) {
              console.log("[EZVIZ Player] stopSaveCallBack triggered:", res);
              if (res && res.data && (res.data instanceof Blob || (typeof res.data === 'string' && res.data.startsWith('blob:')))) {
                triggerBlobDownload(res.data);
              }
            }
          });

          if (typeof playerInstance.on === 'function') {
            playerInstance.on('stopSave', function (res) {
              console.log("[EZVIZ Player] on('stopSave') event:", res);
              if (res && res.data && (res.data instanceof Blob || (typeof res.data === 'string' && res.data.startsWith('blob:')))) {
                triggerBlobDownload(res.data);
              }
            });
          }

          window.recorderStatus.initialized = true;
        } catch (e) {
          window.recorderStatus.error = "EZUIKit Initialization crash: " + e.message;
          console.error(e);
        }
      } else {
        const imouCode = code || deviceId;
        try {
          playerInstance = new imouPlayer({
            id: "player-container",
            width: 800,
            height: 400,
            deviceId: deviceId,
            channelId: Number(channelId),
            token: token,
            type: 2, // Playback
            recordType: recordType,
            beginTime: beginTime,
            endTime: endTime,
            WasmLibPath: "/",
            code: imouCode,
            muted: true,
            domain: domain,
            streamId: 0,
            controls: false, // Hide controls in headless mode
            handleError: function (err) {
              console.error("imouPlayer Error:", err);
              window.recorderStatus.error = err;
            },
            handleCallBack: function (event) {
              console.log("imouPlayer Event:", event);
              if (event.type === 'playStart') {
                window.recorderStatus.playing = true;
              }
            }
          });
          window.recorderStatus.initialized = true;
        } catch (e) {
          window.recorderStatus.error = "Initialization crash: " + e.message;
          console.error(e);
        }
      }
    }

    // Helper to manually trigger anchor download for Blob or blob URL
    function triggerBlobDownload(blobOrUrl, filename) {
      try {
        const url = (blobOrUrl instanceof Blob) ? URL.createObjectURL(blobOrUrl) : blobOrUrl;
        const a = document.createElement('a');
        a.href = url;
        a.download = filename || `recording_${Date.now()}.mp4`;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          if (blobOrUrl instanceof Blob) URL.revokeObjectURL(url);
        }, 1000);
        console.log("[Blob Downloader] Manually triggered download for", a.download);
      } catch (err) {
        console.error("[Blob Downloader Error]", err);
      }
    }

    // Expose control functions for Puppeteer
    window.startRecording = async function () {
      if (!playerInstance) return false;
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code') || '';
      try {
        if (window.recorderStatus.brand === 'ezviz') {
          const recName = `rec_${Date.now()}`;
          const res = playerInstance.startSave(recName, code);
          if (res && typeof res.then === 'function') {
            await res;
          }
        } else {
          playerInstance.startRecord();
        }
        window.recorderStatus.recording = true;
        console.log("Recording started...");
        return true;
      } catch (e) {
        window.recorderStatus.error = "Failed to start recording: " + e.message;
        return false;
      }
    };

    window.stopRecording = async function () {
      if (!playerInstance) return false;
      try {
        if (window.recorderStatus.brand === 'ezviz') {
          const res = playerInstance.stopSave();
          if (res && typeof res.then === 'function') {
            const stopResult = await res;
            console.log("[EZVIZ Player] stopSave promise result:", stopResult);
            if (stopResult && stopResult.data && (stopResult.data instanceof Blob || (typeof stopResult.data === 'string' && stopResult.data.startsWith('blob:')))) {
              triggerBlobDownload(stopResult.data);
            }
          }
        } else {
          playerInstance.stopRecord();
        }
        window.recorderStatus.recording = false;
        window.recorderStatus.downloadStarted = true;
        console.log("Recording stopped. Download triggered.");
        return true;
      } catch (e) {
        window.recorderStatus.error = "Failed to stop recording: " + e.message;
        return false;
      }
    };

    window.setPlaybackSpeed = function (speed) {
      if (!playerInstance) return false;
      if (window.recorderStatus.brand === 'ezviz') {
        console.log("[EZVIZ Player] Speed setting ignored (not supported).");
        return true;
      }
      try {
        playerInstance.setSpeed(Number(speed));
        console.log("Speed set to " + speed);
        return true;
      } catch (e) {
        console.error("Failed to set speed:", e);
        return false;
      }
    };

    // Auto init on page load
    window.addEventListener('load', initPlayer);
  </script>
</body>

</html>
